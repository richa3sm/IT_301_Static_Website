            <h2>Plan Your Trip</h2>
            <p>TODO: Tell visitors what this form is for.</p>

            <!-- Form with HTML validation: required, type="email", min/max -->
            <form action="#">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="days">How many days?</label>
                <input type="number" id="days" name="days" min="1" max="14" required>

                <p>Do you ski or snowboard?</p>
                <label><input type="radio" name="sport" value="ski" required> Ski</label>
                <label><input type="radio" name="sport" value="snowboard"> Snowboard</label>
                <label><input type="radio" name="sport" value="both"> Both</label>

                <button type="submit">Submit</button>
            </form>
        </section>
    </main>
